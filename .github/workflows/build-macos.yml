name: Build macOS app

# Builds Nubby for Mac on a real Mac: one .dmg that runs on Apple Silicon and
# Intel Macs (macOS 11 or newer). Runs on every push to main, for pull requests,
# for version tags and on demand; the .dmg is kept on the run page under
# Artifacts. For a version tag (v0.1.3 …) it is also attached to that tag's
# GitHub Release, next to the Windows setup.
#
# The app is ad-hoc signed (no paid Apple developer account), so the first time
# someone opens it macOS asks them to allow it in Privacy & Security.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # GitHub's Mac machines are sometimes all busy; then the job fails with "not
    # acquired by Runner" without running. Just re-run it later from the Actions
    # tab. (macos-15-intel works too: the .dmg is built for both kinds of Mac.)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Nubby (Apple Silicon + Intel)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Check the app (signature, Apple Silicon + Intel, macOS version)
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Nubby.app"
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIG=$(codesign -dv "$APP" 2>&1 | grep -E "^(Signature|Identifier|Format)" | tr '\n' ' ')
          ARCHS=$(for bin in "$APP"/Contents/MacOS/*; do printf "%s: %s " "$(basename "$bin")" "$(lipo -archs "$bin")"; done)
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          DOCS=$(/usr/libexec/PlistBuddy -c "Print :NSDocumentsFolderUsageDescription" "$APP/Contents/Info.plist")
          echo "::notice title=Nubby.app::${ARCHS}| macOS ${MINOS}+ | ${SIG}"
          echo "::notice title=Nubby.dmg::$(basename "$DMG") $(du -h "$DMG" | cut -f1) sha256 $(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          echo "::notice title=Documents prompt::${DOCS}"

      - name: Smoke test (does Nubby start on a Mac?)
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Nubby.app"
          open "$APP"
          sleep 20
          if pgrep -f "Nubby.app/Contents/MacOS/" > /dev/null; then
            echo "::notice title=Smoke test::Nubby opened and was still running after 20 s"
          else
            echo "::error title=Smoke test::Nubby quit within 20 s of opening"
            exit 1
          fi
          pkill -f "Nubby.app/Contents/MacOS/" || true

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: nubby-macos
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach the .dmg to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

name: Build Windows installer

# Builds Nubby on a real Windows machine on every push to main, for pull
# requests, version tags and on demand, as a check that the code builds. The
# installers it makes are kept on the run page under Artifacts.
#
# It does not touch Releases: the setup on the Releases page is made with
# installer/nubby.nsi (see scripts/cross-build-windows.sh) and attached by hand,
# so everyone gets the same installer.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Nubby
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nubby-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
